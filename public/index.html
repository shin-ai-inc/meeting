<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#061f44">
  <meta name="description" content="ShinAI｜AIが働ける情報基盤づくりと導入伴走支援">
  <title>ShinAI｜AIが働ける土台を。</title>
  <style>
    :root {
      color-scheme: light;
      --navy: #061f44;
      --focus: #f0b640;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      background: var(--navy);
    }
    body {
      display: flex;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic", sans-serif;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }
    .lp {
      position: relative;
      width: min(100%, 1206px);
      line-height: 0;
      background: #fff;
      overflow: hidden;
      box-shadow: 0 0 40px rgba(0, 0, 0, .18);
    }
    .lp-image {
      display: block;
      width: 100%;
      height: auto;
      aspect-ratio: 1206 / 2622;
    }
    .cta-link {
      position: absolute;
      left: 16.4%;
      top: 95.55%;
      width: 67.2%;
      height: 3.55%;
      border-radius: 999px;
      cursor: pointer;
      -webkit-tap-highlight-color: rgba(240, 182, 64, .18);
    }
    .cta-link:focus-visible {
      outline: 4px solid var(--focus);
      outline-offset: -4px;
    }
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
    @media (min-width: 1207px) {
      body { padding: 24px 0; }
      .lp { border-radius: 2px; }
    }
  </style>
</head>
<body>
  <main class="lp" aria-label="ShinAI AIネイティブ基盤のご案内">
    <img
      class="lp-image"
      src="assets/shinai-lp-1206x2622.png"
      width="1206"
      height="2622"
      alt="ShinAI。社内に散在する文書・資料・台帳を整え、AIが読める・つながる・答えられる状態へ導く情報基盤づくりと伴走支援のご案内。"
    >
    <a
      class="cta-link"
      href="https://meeting-taupe.vercel.app/consult"
      aria-label="30分相談の日程を選ぶ"
      title="30分相談の日程を選ぶ"
    ><span class="sr-only">30分相談の日程を選ぶ</span></a>
  </main>
</body>
</html>
